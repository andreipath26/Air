name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    name: Core correctness and native runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: python3 scripts/test-evidence-gate.py
      - run: python3 -m py_compile scripts/g01-benchmark.py scripts/g01-run.py scripts/g01-corpus.py scripts/g01-resource.py scripts/g01-assemble.py scripts/g02-hybrid.py scripts/g02-evaluate.py
      - run: python3 scripts/test-g02-hybrid.py
      - run: python3 scripts/test-g02-evaluate.py
      - run: python3 scripts/test-g01-pipeline.py
      - run: python3 scripts/test-g01-answer.py
      - run: python3 scripts/test-g01-reconcile.py
      - run: python3 scripts/test-g01-real-development.py
      - run: python3 -m py_compile scripts/g01-resolve-pins.py scripts/g01-ensemble-report.py
      - run: python3 -m py_compile scripts/g01-review.py scripts/g01-real-development.py
      - run: python3 -m py_compile scripts/g01-development.py scripts/g01-run.py scripts/g01-real-development.py
      - run: cargo run -p air-cli -- doctor
      - run: cargo test -p air-core representation_selection
      - run: cargo test -p air-core lexical
      - run: bash scripts/run-cpu-budgeted.sh target/debug/air-cli doctor
  storage:
    name: Knowledge and storage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo run -p air-cli -- import knowledge/examples/demo.tsv /tmp/demo.air
          cargo run -p air-cli -- lookup /tmp/demo.air France capital | grep Paris
          cargo run -p air-cli -- category /tmp/demo.air automotive | grep Combustion
      - run: |
          cargo run -p air-cli -- index-import knowledge/examples/demo.tsv /tmp/air-demo.db
          cargo run -p air-cli -- ask /tmp/air-demo.db "What is the capital of France?" | grep Paris
          cargo run -p air-cli -- ask /tmp/air-demo.db "calculate 583 * 927" | grep 540441
          cargo run -p air-cli -- ask /tmp/air-demo.db "unknown request" '{"kind":"category","category":"automotive"}' | grep Combustion
          cargo run --release -p air-bench -- retrieval 1000 /tmp/air-bench.db
      - run: |
          cargo run -p air-cli -- probability knowledge/examples/probability.json | grep probability
          python3 -c 'import hashlib,json; p="knowledge/examples/demo.tsv"; print(json.dumps(dict(format=1,name="fixture",version="1",license="test fixture",sha256=hashlib.sha256(open(p,"rb").read()).hexdigest())))' > /tmp/air-manifest.json
          cargo run -p air-cli -- package-import /tmp/air-package.db /tmp/air-policy.db /tmp/air-manifest.json knowledge/examples/demo.tsv
          cargo run -p air-cli -- session /tmp/air-package.db /tmp/air-memory.db /tmp/air-policy.db "What is the capital of France?" | grep Paris
      - run: |
          cargo run -p air-cli -- teach-route /tmp/air-policy.db automotive "diesel engine smoke combustion injection"
          cargo run -p air-cli -- teach-route /tmp/air-policy.db geography "country capital city continent"
          cargo run -p air-cli -- session /tmp/air-demo.db /tmp/air-memory.db /tmp/air-policy.db "diesel engine smoke combustion injection" | grep "Suggested category"
          cargo run -p air-cli -- observe /tmp/air-predict.db a b
          cargo run -p air-cli -- predict /tmp/air-predict.db a | grep "1 | b"
          cargo run -p air-cli -- revision-put /tmp/air-rev.db demo knowledge/examples/demo.tsv
          cargo run -p air-cli -- revision-put /tmp/air-rev.db demo knowledge/examples/compound.json
          cargo run -p air-cli -- revision-rollback /tmp/air-rev.db demo 1
          cargo run -q -p air-cli -- revision-get /tmp/air-rev.db demo | cmp - knowledge/examples/demo.tsv
  cognition:
    name: Cognition and language
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -p air-cli -- index-import knowledge/examples/demo.tsv /tmp/air-demo.db
      - run: |
          cargo run -p air-cli -- remember /tmp/air-memory.db "diesel engine" "inspect air intake"
          cargo run -p air-cli -- recall /tmp/air-memory.db diesel | grep "inspect air intake"
          cargo run -p air-cli -- learn-skill /tmp/air-memory.db multiply knowledge/examples/multiply.json
          test "$(cargo run -q -p air-cli -- run-skill /tmp/air-memory.db multiply 11 13)" = 143
          AIR_LANGUAGE=fr cargo run -p air-cli -- ask /tmp/air-demo.db "What is the capital of France?" | grep "Paris est la capitale"
      - run: |
          cargo run -p air-cli -- alias /tmp/air-policy.db relation "capital city" capital
          cargo run -p air-cli -- review /tmp/air-policy.db France capital Paris accept fixture "test evidence"
          cargo run -p air-cli -- session /tmp/air-demo.db /tmp/air-memory.db /tmp/air-policy.db "What is the capital city of France?" | grep "Operator review"
          cargo run -p air-cli -- synthesise /tmp/air-memory.db compound knowledge/examples/compound.json
          cargo run -p air-cli -- approve-skill /tmp/air-policy.db /tmp/air-memory.db compound 1
          test "$(cargo run -q -p air-cli -- session /tmp/air-demo.db /tmp/air-memory.db /tmp/air-policy.db "skill compound 8 10")" = 81
          cargo run -p air-cli -- session /tmp/air-demo.db /tmp/air-memory.db /tmp/air-policy.db "recall diesel" | grep "inspect air intake"
  compiler:
    name: Compiler, dataflow and execution security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -p air-cli -- index-import knowledge/examples/demo.tsv /tmp/air-demo.db
      - run: |
          cargo run -p air-cli -- remember /tmp/air-memory.db "diesel engine" "inspect air intake"
          cargo run -p air-cli -- recall /tmp/air-memory.db diesel | grep "inspect air intake"
          cargo run -p air-cli -- learn-skill /tmp/air-memory.db multiply knowledge/examples/multiply.json
          test "$(cargo run -q -p air-cli -- run-skill /tmp/air-memory.db multiply 11 13)" = 143
          AIR_LANGUAGE=fr cargo run -p air-cli -- ask /tmp/air-demo.db "What is the capital of France?" | grep "Paris est la capitale"
      - run: |
          cargo run -p air-cli -- alias /tmp/air-policy.db relation "capital city" capital
          cargo run -p air-cli -- review /tmp/air-policy.db France capital Paris accept fixture "test evidence"
          cargo run -p air-cli -- session /tmp/air-demo.db /tmp/air-memory.db /tmp/air-policy.db "What is the capital city of France?" | grep "Operator review"
          cargo run -p air-cli -- synthesise /tmp/air-memory.db compound knowledge/examples/compound.json
          cargo run -p air-cli -- approve-skill /tmp/air-policy.db /tmp/air-memory.db compound 1
          test "$(cargo run -q -p air-cli -- session /tmp/air-demo.db /tmp/air-memory.db /tmp/air-policy.db "skill compound 8 10")" = 81
          cargo run -p air-cli -- session /tmp/air-demo.db /tmp/air-memory.db /tmp/air-policy.db "recall diesel" | grep "inspect air intake"
      - run: |
          cargo run -p air-cli -- plan /tmp/air-demo.db /tmp/air-memory.db /tmp/air-policy.db knowledge/examples/plan.json | grep '"stopped":null'
          cargo run -p air-cli -- evaluate /tmp/air-demo.db /tmp/air-memory.db /tmp/air-policy.db knowledge/examples/evaluation.json | python3 -c 'import sys,json; x=json.load(sys.stdin); assert x["correct"]==x["total"]==4 and x["model_calls"]==0'
          cargo run -p air-cli -- compact-put /tmp/air-compact.db demo knowledge/examples/demo.tsv
          cargo run -q -p air-cli -- compact-get /tmp/air-compact.db demo | cmp - knowledge/examples/demo.tsv
          cargo run -p air-cli -- temporal-record /tmp/air-time.db a state old 0 10 fixture
          cargo run -p air-cli -- temporal-record /tmp/air-time.db a state new 10 none fixture
          cargo run -p air-cli -- temporal-at /tmp/air-time.db a state 10 | grep new
      - run: |
          cargo run -p air-cli -- dataflow /tmp/air-demo.db /tmp/air-memory.db /tmp/air-policy.db knowledge/examples/dataflow.json | grep '"values":\[12,36\]'
          printf '%s\n' '{"kind":"health"}' '{"kind":"ask","question":"calculate 5 * 7"}' | cargo run -q -p air-cli -- serve /tmp/air-demo.db /tmp/air-memory.db /tmp/air-policy.db | python3 -c 'import sys,json; a,b=map(json.loads,sys.stdin); assert a["result"]["status"]=="ready" and b["result"]["text"]=="35"'
      - run: |
          cargo run -p air-cli -- revoke-skill /tmp/air-policy.db compound 1
          if cargo run -p air-cli -- session /tmp/air-demo.db /tmp/air-memory.db /tmp/air-policy.db "skill compound 8 10"; then exit 1; fi
          printf '%s\n' '{"kind":"ask","question":"calculate 5 * 7"}' '{"kind":"metrics"}' | cargo run -q -p air-cli -- serve /tmp/air-demo.db /tmp/air-memory.db /tmp/air-policy.db | python3 -c 'import sys,json; a,b=map(json.loads,sys.stdin); assert b["result"]["requests"]==1 and b["result"]["completed"]==1'
  amt:
    name: Model transcompiler and checkpoint analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          python3 -c 'import json,struct; h=json.dumps({"weight":{"dtype":"F32","shape":[2],"data_offsets":[0,8]}}).encode(); open("/tmp/air-fixture.safetensors","wb").write(struct.pack("<Q",len(h))+h+struct.pack("<ff",1,2))'
          cargo run -p air-cli -- amt-inspect /tmp/air-fixture.safetensors | grep sha256
      - run: |
          cargo run -p air-cli -- amt-stats /tmp/air-fixture.safetensors | python3 -c 'import json,sys; a=json.load(sys.stdin)[0]; assert a["elements"]==2 and a["mean"]==1.5 and a["finite"]==2'
          python3 -m py_compile scripts/amt-real-model.py
      - run: cargo test -p air-core amt
      - run: cargo test -p air-core intelligence_package
      - run: cargo test -p air-core classifier_package
      - run: cargo test -p air-core elicitation
      - run: cargo test -p air-core discovery
      - run: cargo test -p air-core prefetch
      - run: python3 -m py_compile scripts/amt-structural.py
  performance:
    name: Performance and resource measurements
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --release -p air-bench -- 100000
      - run: cargo run --release -p air-bench -- retrieval 10000 /tmp/air-scale.db
      - run: |
          cargo build --release -p air-cli
          python3 scripts/g01-corpus.py knowledge/examples/g01-corpus-smoke.json /tmp/g01-corpus --mode reference
          python3 scripts/g01-benchmark.py knowledge/examples/g01-smoke.json /tmp/g01-observations --system air --db /tmp/g01-corpus/knowledge.db --policy /tmp/g01-corpus/policy.db --router knowledge/examples/g01-router.json
          python3 -c 'import json; x=json.load(open("/tmp/g01-observations/observations.json")); assert x["answers"]=={"fixture-1":"Paris","fixture-2":None} and not x["gate_eligible"]'
          python3 scripts/g01-development.py /tmp/g01-dev
          python3 scripts/g01-run.py /tmp/g01-dev/corpus.json /tmp/g01-dev/dataset.json /tmp/g01-dev/router.json /tmp/g01-dev-run --development-reference-only
          python3 -c 'import json; x=json.load(open("/tmp/g01-dev-run/summary.json")); assert x["systems"]["reference_retrieval"]["correct"]==240 and not x["gate_eligible"]'

