name: AMT real-model experiment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amt-experiment.yml'
      - 'scripts/amt-real-model.py'
      - 'scripts/amt-structural.py'
      - 'scripts/g01-real-development.py'
      - 'knowledge/development/**'
      - 'crates/air-core/src/elicitation.rs'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        teacher: ['Qwen/Qwen2.5-0.5B-Instruct', 'Qwen/Qwen2.5-1.5B-Instruct']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cargo build --release -p air-cli
      - run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.51.3 huggingface_hub==0.30.2
      - run: /usr/bin/time -v python scripts/amt-real-model.py --out amt-results --model '${{ matrix.teacher }}' --structural --g01-development
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amt-real-model-results-${{ strategy.job-index }}
          path: amt-results/
          if-no-files-found: warn
