[package]
name = "air-core"
version.workspace = true
edition.workspace = true

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "hooks", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

ureq = { version = "2.12", default-features = false, features = ["json"] }
